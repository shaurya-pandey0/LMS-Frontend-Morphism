# =============================================================================
#  LifeTrack — full production stack
#
#    web         nginx: React SPA + reverse proxy   (only public port: 80/443)
#    backend     Spring Boot 3.3.4 / Java 17        (internal :8080)
#    ai-service  FastAPI + uvicorn                  (internal :8100)
#    db          MySQL 8.4                          (internal :3306)
#    prometheus  metrics scraper   -> profile "monitoring"
#    grafana     dashboards        -> profile "monitoring"
#
#  Usage:
#    cp .env.example .env && edit it        # secrets live here, never in git
#    docker compose build
#    docker compose up -d
#    docker compose --profile monitoring up -d
# =============================================================================

name: lifetrack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------- database
  db:
    image: mysql:8.4
    container_name: lifetrack-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=2G
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lifestyle_ai}
      MYSQL_USER: ${MYSQL_USER:-lifetrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/mysql
      # Anything in here runs once, on first initialisation of an empty volume.
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    # Not published to the host. Use `docker compose exec db mysql ...`.
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [lifetrack]
    logging: *default-logging

  # ---------------------------------------------------------------- backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lifetrack/backend:${IMAGE_TAG:-latest}
    container_name: lifetrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-lifestyle_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:-UTC}&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-lifetrack}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      # Base64-encoded 256-bit secret. Generate: openssl rand -base64 48
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      # Same-origin through nginx, so this only matters for direct API clients.
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_INSIGHTS_MIN_SLEEP_HOURS: ${APP_INSIGHTS_MIN_SLEEP_HOURS:-6.0}
      APP_INSIGHTS_GOOD_SLEEP_HOURS: ${APP_INSIGHTS_GOOD_SLEEP_HOURS:-7.5}
      APP_INSIGHTS_WEEKLY_SPENDING_THRESHOLD: ${APP_INSIGHTS_WEEKLY_SPENDING_THRESHOLD:-1000.0}
      APP_INSIGHTS_MIN_WATER_INTAKE_ML: ${APP_INSIGHTS_MIN_WATER_INTAKE_ML:-2000.0}
      APP_INSIGHTS_HABIT_CONSISTENCY_THRESHOLD: ${APP_INSIGHTS_HABIT_CONSISTENCY_THRESHOLD:-0.5}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseContainerSupport}
      TZ: ${TZ:-UTC}
    expose:
      - "8080"
    # Uncomment to debug from the VM itself (loopback only, never 0.0.0.0):
    # ports:
    #   - "127.0.0.1:8080:8080"
    networks: [lifetrack]
    logging: *default-logging

  # ------------------------------------------------------------- ai-service
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    image: lifetrack/ai-service:${IMAGE_TAG:-latest}
    container_name: lifetrack-ai
    restart: unless-stopped
    environment:
      AI_PORT: "8100"
      AI_WORKERS: ${AI_WORKERS:-2}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:?set AI_API_KEY in .env}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_TEMPERATURE: ${AI_TEMPERATURE:-0.4}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_TOKENS: ${AI_MAX_TOKENS:-800}
      AI_JSON_MODE: ${AI_JSON_MODE:-auto}
      AI_RETRIEVAL_MODE: ${AI_RETRIEVAL_MODE:-full}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      VECTOR_DATA_DIR: /app/data/users
      VECTOR_TOP_K: ${VECTOR_TOP_K:-5}
      VECTOR_CACHE_USERS: ${VECTOR_CACHE_USERS:-16}
      VECTOR_BIT_WIDTH: ${VECTOR_BIT_WIDTH:-4}
      VECTOR_BACKEND: ${VECTOR_BACKEND:-auto}
      # Salts the on-disk user folder hash. Changing it orphans existing stores.
      USER_KEY_SALT: ${USER_KEY_SALT:?set USER_KEY_SALT in .env}
      MAX_SNIPPET_CHARS: ${MAX_SNIPPET_CHARS:-500}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      TZ: ${TZ:-UTC}
    volumes:
      - ai_vectors:/app/data/users
    expose:
      - "8100"
    networks: [lifetrack]
    logging: *default-logging

  # -------------------------------------------------- web edge (SPA + proxy)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Same-origin paths proxied by this container. Override only if you
        # serve the APIs from different hostnames.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-/ai}
    image: lifetrack/web:${IMAGE_TAG:-latest}
    container_name: lifetrack-web
    restart: unless-stopped
    depends_on:
      - backend
      - ai-service
    environment:
      # Rendered into the nginx config at container start. Both services are on
      # this host's compose network in the single-VM topology.
      BACKEND_UPSTREAM: http://backend:8080
      AI_UPSTREAM: http://ai-service:8100
      AI_PROXY_TOKEN: ""
      TZ: ${TZ:-UTC}
    ports:
      - "${HTTP_PORT:-80}:80"
      # Enable after installing certificates (see deploy/nginx/tls.conf.example)
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      # Drop extra server blocks (e.g. TLS) here without rebuilding the image.
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d/extra:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [lifetrack]
    logging: *default-logging

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lifetrack-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    # Loopback only: reach it via `gcloud compute ssh --tunnel-through-iap -- -L 9090:localhost:9090`
    ports:
      - "127.0.0.1:9090:9090"
    networks: [lifetrack]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lifetrack-grafana
    restart: unless-stopped
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [lifetrack]
    logging: *default-logging

networks:
  lifetrack:
    driver: bridge

volumes:
  db_data:
  ai_vectors:
  prometheus_data:
  grafana_data:
