# Shared security headers.
#
# nginx does NOT merge add_header across levels: as soon as a location declares
# one add_header, every add_header from the enclosing server block is dropped.
# So this snippet is included in the server block AND in each location that
# sets its own headers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
