# Prometheus config for the containerised stack. Unlike monitoring/prometheus.yml
# (which targets host.docker.internal for local Windows development), this scrapes
# the backend by its compose service name over the internal network.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  external_labels:
    env: production

scrape_configs:
  - job_name: "lifetrack-backend"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["backend:8080"]
        labels:
          service: backend

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
