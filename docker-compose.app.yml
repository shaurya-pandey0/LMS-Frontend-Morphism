# =============================================================================
#  LifeTrack — SPLIT DEPLOYMENT, part 1 of 2: the APP VM.
#
#    web         nginx: React SPA + reverse proxy   (only public port: 80/443)
#    backend     Spring Boot 3.3.4 / Java 17        (internal :8080)
#    db          MySQL 8.4                          (internal :3306)
#    prometheus / grafana                           -> profile "monitoring"
#
#  The AI service runs on a SECOND VM, deployed with docker-compose.ai.yml.
#  nginx proxies /ai/* to AI_UPSTREAM over the VPC, so the browser still only
#  ever talks to this host and there is no CORS involved.
#
#  Usage on the app VM:
#    cp .env.app.example .env && edit it
#    bash deploy/scripts/deploy.sh --role app
#
#  For a single-VM deployment use docker-compose.yml instead. See
#  DEPLOYMENT-SPLIT.md and DEPLOYMENT.md.
# =============================================================================

name: lifetrack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ---------------------------------------------------------------- database
  db:
    image: mysql:8.4
    container_name: lifetrack-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=2G
      - --max-connections=300
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lifestyle_ai}
      MYSQL_USER: ${MYSQL_USER:-lifetrack}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      TZ: ${TZ:-UTC}
    volumes:
      - db_data:/var/lib/mysql
      - ./deploy/mysql/init:/docker-entrypoint-initdb.d:ro
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks: [lifetrack]
    logging: *default-logging

  # ---------------------------------------------------------------- backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lifetrack/backend:${IMAGE_TAG:-latest}
    container_name: lifetrack-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/${MYSQL_DATABASE:-lifestyle_ai}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:-UTC}&characterEncoding=utf8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-lifetrack}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      SPRING_JPA_SHOW_SQL: "false"
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_INSIGHTS_MIN_SLEEP_HOURS: ${APP_INSIGHTS_MIN_SLEEP_HOURS:-6.0}
      APP_INSIGHTS_GOOD_SLEEP_HOURS: ${APP_INSIGHTS_GOOD_SLEEP_HOURS:-7.5}
      APP_INSIGHTS_WEEKLY_SPENDING_THRESHOLD: ${APP_INSIGHTS_WEEKLY_SPENDING_THRESHOLD:-1000.0}
      APP_INSIGHTS_MIN_WATER_INTAKE_ML: ${APP_INSIGHTS_MIN_WATER_INTAKE_ML:-2000.0}
      APP_INSIGHTS_HABIT_CONSISTENCY_THRESHOLD: ${APP_INSIGHTS_HABIT_CONSISTENCY_THRESHOLD:-0.5}
      JAVA_OPTS: ${JAVA_OPTS:--XX:MaxRAMPercentage=70 -XX:+UseContainerSupport}
      TZ: ${TZ:-UTC}
    expose:
      - "8080"
    networks: [lifetrack]
    logging: *default-logging

  # -------------------------------------------------- web edge (SPA + proxy)
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL:-/ai}
    image: lifetrack/web:${IMAGE_TAG:-latest}
    container_name: lifetrack-web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      BACKEND_UPSTREAM: http://backend:8080
      # THE difference from the single-VM stack: the AI service lives on
      # another host. Internal VPC address, e.g. http://10.128.0.5:8100
      AI_UPSTREAM: ${AI_UPSTREAM:?set AI_UPSTREAM to the AI VM, e.g. http://10.128.0.5:8100}
      # Shared secret checked by the AI VM's edge nginx. Must match
      # AI_SHARED_TOKEN in the AI VM's .env.
      AI_PROXY_TOKEN: ${AI_SHARED_TOKEN:?set AI_SHARED_TOKEN in .env}
      TZ: ${TZ:-UTC}
    ports:
      - "${HTTP_PORT:-80}:80"
      # - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d/extra:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    networks: [lifetrack]
    logging: *default-logging

  # ------------------------------------------------------------- monitoring
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: lifetrack-prometheus
    restart: unless-stopped
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROM_RETENTION:-15d}
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks: [lifetrack]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.3.0
    container_name: lifetrack-grafana
    restart: unless-stopped
    profiles: [monitoring]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks: [lifetrack]
    logging: *default-logging

networks:
  lifetrack:
    driver: bridge

volumes:
  db_data:
  prometheus_data:
  grafana_data:
